<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Obscura DP</title>
    <style>
      @font-face {
        font-family: 'Source Serif 4 Variable';
        font-weight: 200 900;
        src: url('../../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #ffffff;
        overflow: hidden;
      }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Source Serif 4 Variable', Georgia, serif;
        color: #101828;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-weight: 600;
        font-size: 34px;
        letter-spacing: -0.01em;
      }
      .brand svg {
        height: 44px;
        width: auto;
      }
      .brand img {
        height: 84px;
        width: auto;
        margin-left: -8px;
      }
      .brand b {
        color: #1a5cf4;
        font-weight: 600;
      }
      h1 {
        margin: 0;
        font-weight: 600;
        font-size: 64px;
        line-height: 1.08;
        letter-spacing: -0.015em;
        max-width: 17ch;
      }
      .rule {
        height: 3px;
        width: 160px;
        background: #1a5cf4;
        margin: 0 0 28px;
      }
      .foot {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 20px;
        color: #667085;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand" id="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="#1a5cf4" stroke-width="2.5" />
          <path d="M16 7.5a8.5 8.5 0 0 1 0 17z" fill="#1a5cf4" />
        </svg>
        <span>Obscura<b>DP</b></span>
      </div>
      <div>
        <div class="rule"></div>
        <h1>Mathematically guaranteed privacy, free for every AI pipeline.</h1>
      </div>
      <div class="foot">
        <span>obscuradp.org</span>
        <span>Open-source privacy framework for AI</span>
      </div>
    </div>
  </body>
</html>
