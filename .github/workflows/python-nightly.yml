name: Python nightly

# Slower checks that should not block pull requests: slow and integration tests against the pinned
# versions, the same tests against the newest versions of every dependency, and a scan for known
# vulnerabilities.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  slow:
    name: Slow and integration tests (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -c constraints/legacy-py311.txt -e ".[dev,legacy]"
      - name: Tests
        run: pytest

  latest:
    name: Tests against the newest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install without pins
        run: python -m pip install --upgrade -e ".[dev]"
      - name: Tests
        run: pytest -m "not slow and not integration"

  audit:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -c constraints/dev.txt -e ".[dev]"
          python -m pip install pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable
