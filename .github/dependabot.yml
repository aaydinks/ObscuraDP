version: 2

# One grouped pull request per ecosystem per week, to keep the noise down.
#
# The research folders (Experiment 1 to 3, Trial 07) and the pins that reproduce their results
# are frozen on purpose: they are the reference the library is compared against. They must
# never be updated automatically.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    exclude-paths:
      - "Experiment 1/**"
      - "Experiment 2/**"
      - "Experiment 3/**"
      - "Trial 07/**"
      - "constraints/legacy-py311.txt"
    groups:
      python:
        patterns: ["*"]
    ignore:
      # sympy, which torch needs, requires mpmath below 1.4 (true of sympy 1.14.0, the newest
      # release on 2026-11-10). Remove this rule once a released sympy accepts mpmath 1.4.
      - dependency-name: mpmath
        versions: [">=1.4"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      website:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The Astro type checker (@astrojs/check) accepts TypeScript 5 and 6 only. Remove this
      # rule once a released version of it accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
