version: 2

# One grouped pull request per ecosystem per week, to keep the noise down.
#
# The research folders (Experiment 1 to 3, Trial 07) and the pins that reproduce their results
# are frozen on purpose: they are the reference the library is compared against. They must
# never be updated automatically.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    exclude-paths:
      - "Experiment 1/**"
      - "Experiment 2/**"
      - "Experiment 3/**"
      - "Trial 07/**"
      - "constraints/legacy-py311.txt"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      website:
        patterns: ["*"]
        update-types: ["minor", "patch"]
